<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image map tester</title>
  <style>
    /* The tester is intentionally self-contained: no framework or server. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font: 16px/1.4 system-ui, sans-serif;
      color: #202124;
      background: #f4f6f8;
    }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 18px; font-size: 1.6rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px;
      margin-bottom: 18px;
      background: white;
      border: 1px solid #d8dde3;
      border-radius: 8px;
    }
    label { display: grid; gap: 6px; font-weight: 600; }
    input[type="file"] { font: inherit; font-weight: normal; }
    #message { min-height: 24px; margin: 0 0 12px; }
    #message.error { color: #b00020; }
    /* The stage is the positioning parent for percentage-based overlays. */
    #stage {
      position: relative;
      display: none;
      width: fit-content;
      max-width: 100%;
      line-height: 0;
      background: white;
      box-shadow: 0 2px 12px #0002;
    }
    #image {
      display: block;
      max-width: 100%;
      height: auto;
    }
    /* Each map entry becomes a transparent, keyboard-accessible button. */
    .map-area {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 3px solid #00c853;
      background: rgb(0 200 83 / 18%);
      color: #071;
      font: 700 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .map-area:hover, .map-area:focus {
      z-index: 1;
      outline: 2px solid white;
      background: rgb(255 193 7 / 35%);
      border-color: #ff9800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Image map tester</h1>
    <section class="controls" aria-label="File selection">
      <label>
        Select image
        <input id="image-file" type="file" accept="image/*">
      </label>
      <label>
        Select map
        <input id="map-file" type="file" accept=".txt,.json,application/json,text/plain">
      </label>
    </section>

    <p id="message">Select an image and a map file.</p>
    <div id="stage">
      <img id="image" alt="Selected image">
    </div>
  </main>

  <script>
    // Cache the small set of DOM nodes used throughout the page.
    const imageInput = document.getElementById('image-file');
    const mapInput = document.getElementById('map-file');
    const stage = document.getElementById('stage');
    const image = document.getElementById('image');
    const message = document.getElementById('message');

    // The browser creates an in-memory blob URL for the selected local image.
    // ``areas`` remains null until a valid JSON map has been selected.
    let imageUrl = null;
    let areas = null;

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle('error', isError);
    }

    /** Normalize a JSON value such as "12.5%" or 12.5 to a safe CSS percent. */
    function cssPercent(value, property, index) {
      const text = String(value).trim();
      const number = Number.parseFloat(text);
      if (!Number.isFinite(number) || number < 0 || number > 100) {
        throw new Error(`Area ${index + 1}: invalid ${property}`);
      }
      return `${number}%`;
    }

    /**
     * Validate untrusted local JSON before assigning any values to element styles.
     * The normal format is an array; {"areas": [...]} is accepted for convenience.
     */
    function validateMap(data) {
      const list = Array.isArray(data) ? data : data.areas;
      if (!Array.isArray(list) || list.length === 0) {
        throw new Error('The map must be a non-empty JSON array.');
      }

      return list.map((area, index) => {
        if (!area || typeof area !== 'object') {
          throw new Error(`Area ${index + 1} is not an object.`);
        }
        const result = {
          left: cssPercent(area.left, 'left', index),
          top: cssPercent(area.top, 'top', index),
          width: cssPercent(area.width, 'width', index),
          height: cssPercent(area.height, 'height', index),
          label: area.label || area.language || `Area ${index + 1}`
        };
        // A tiny tolerance avoids rejecting harmless floating-point rounding.
        if (parseFloat(result.left) + parseFloat(result.width) > 100.01 ||
            parseFloat(result.top) + parseFloat(result.height) > 100.01) {
          throw new Error(`Area ${index + 1} extends outside the image.`);
        }
        return result;
      });
    }

    /** Replace old overlays and draw the currently selected map, if complete. */
    function render() {
      // Rendering is idempotent: always remove targets from the previous map.
      stage.querySelectorAll('.map-area').forEach(element => element.remove());
      if (!imageUrl || !areas) {
        stage.style.display = imageUrl ? 'block' : 'none';
        return;
      }

      areas.forEach((area, index) => {
        // A button works with mouse, touch, Enter, and Space without extra code.
        const target = document.createElement('button');
        target.type = 'button';
        target.className = 'map-area';
        target.textContent = index + 1;
        target.title = area.label;
        target.setAttribute('aria-label', area.label);
        Object.assign(target.style, {
          left: area.left,
          top: area.top,
          width: area.width,
          height: area.height
        });
        target.addEventListener('click', () => {
          setMessage(`Clicked: ${area.label}`);
        });
        stage.appendChild(target);
      });

      stage.style.display = 'block';
      setMessage(`Displaying ${areas.length} clickable area${areas.length === 1 ? '' : 's'}.`);
    }

    // Local files are never uploaded; File/Blob browser APIs read them in place.
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setMessage('Please select a valid image file.', true);
        return;
      }
      // Release the previous blob URL before replacing it to avoid memory leaks.
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      imageUrl = URL.createObjectURL(file);
      image.src = imageUrl;
      image.onload = render;
      image.onerror = () => setMessage('The selected image could not be loaded.', true);
    });

    // Map files are plain JSON despite their human-friendly .map.txt suffix.
    mapInput.addEventListener('change', async () => {
      const file = mapInput.files[0];
      if (!file) return;
      try {
        areas = validateMap(JSON.parse(await file.text()));
        render();
      } catch (error) {
        areas = null;
        render();
        setMessage(`Map error: ${error.message}`, true);
      }
    });

    // Final cleanup when the tab closes or navigates away.
    window.addEventListener('beforeunload', () => {
      if (imageUrl) URL.revokeObjectURL(imageUrl);
    });
  </script>
</body>
</html>
